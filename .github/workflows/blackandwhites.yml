
name: BlackandWhites New Post

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackandwhites-new-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto google-api-python-client google-auth Pillow

      - name: Run BlackandWhites New Post
        env:
          BLACKANDWHITES_PASSWORD: ${{ secrets.BLACKANDWHITES_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python blackandwhites_new_post.py
        

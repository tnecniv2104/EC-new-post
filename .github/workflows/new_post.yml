
name: Eyescandy New Post

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eyescandy-new-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto google-auth google-api-python-client Pillow

      - name: Run Eyescandy New Post
        env:
          BLUESKY_HANDLE: eyescandy.bsky.social
          BLUESKY_PASSWORD: ${{ secrets.EYESCANDY_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: "1JQx_1SBOETCSMlmlQSIFOjSBuL4op5KA"
          DRIVE_ACCOUNT_FOLDER_ID: "1pHJJ7MhlhFUljU2XUHsS8yKaGj-ws0X0"
          DRIVE_READY_FOLDER_ID: "1hBt9c6yLNEhl4Apbmt0kKhp6mOwTeA2a"
          DRIVE_USED_FOLDER_ID: "1B99lfVaFqLsIsitdj5eGVd3Rau9Q8sTK"
        run: python eyescandy_new_post.py
